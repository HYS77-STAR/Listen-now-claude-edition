name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. Java
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Find Flutter project
      - name: Find Flutter Project
        shell: bash
        run: |
          set -e

          echo "Searching for pubspec.yaml..."

          PUBSPEC_PATH=$(find . -type f -name "pubspec.yaml" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml was not found."
            echo ""
            echo "Repository structure:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")

          echo "Found Flutter project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Apply Android overrides
      - name: Apply Android Overrides
        shell: bash
        run: |
          set -e

          if [ -d "android_overrides" ]; then
            echo "Applying Android overrides..."

            mkdir -p "$PROJECT_DIR/android"

            cp -R android_overrides/. "$PROJECT_DIR/android/"

            echo "Android overrides applied successfully."
          else
            echo "No android_overrides directory found."
          fi

      # 6. Flutter dependencies
      - name: Install Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # 7. Build APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      # 8. Verify APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Generated APK files:"
          find build -type f -name "*.apk" -print

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found successfully:"
          ls -lh "$APK_PATH"

      # 9. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
