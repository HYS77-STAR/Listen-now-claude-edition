name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        working-directory: .
        run: |
          set -e
          PUB=$(find . -name pubspec.yaml -not -path './.git/*' | head -1)
          if [ -z "$PUB" ]; then
            ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
            if [ -z "$ZIP" ]; then echo "No pubspec.yaml and no zip found"; ls -R | head -50; exit 1; fi
            mkdir unz && unzip -q "$ZIP" -d unz
            PUB=$(find unz -name pubspec.yaml | head -1)
          fi
          DIR=$(dirname "$PUB")
          echo "Project found in: $DIR"
          mkdir app
          rsync -a --exclude .git --exclude app --exclude unz "$DIR"/ app/
          ls -a app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p /tmp/keep
          cp -r lib assets pubspec.yaml /tmp/keep/
          flutter create --platforms=android --org com.hus --project-name hus_player .
          rm -rf lib assets pubspec.yaml test
          cp -r /tmp/keep/lib /tmp/keep/assets /tmp/keep/pubspec.yaml .
          rm -f android/app/src/main/java/com/hus/hus_player/MainActivity.java
          cp -r android_overrides/. android/

      - name: Skip lint-vital
        run: |
          mkdir -p $HOME/.gradle/init.d
          cat > $HOME/.gradle/init.d/skip-lint.gradle <<'GRADLE'
          allprojects {
              tasks.whenTaskAdded { task ->
                  if (task.name.startsWith('lintVital') || task.name.startsWith('lintAnalyze')) {
                      task.enabled = false
                  }
              }
          }
          GRADLE

      - run: flutter pub get
      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: listen-now-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
